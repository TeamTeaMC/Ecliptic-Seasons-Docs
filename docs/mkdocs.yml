site_name: Ecliptic Seasons
site_url: https://ecliptic-seasons.readthedocs.io/
site_description: Player, modpack, datapack, resource-pack, and developer documentation for Ecliptic Seasons
site_author: The Ecliptic Seasons Team
repo_url: https://github.com/joe-vettek/Ecliptic-Seasons
repo_name: Ecliptic Seasons

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

nav:
  - English:
      - Start here:
          - Overview: en/index.md
          - Quick start: en/quickly_start.md
          - Version support: en/version_support.md
          - Troubleshooting: en/troubleshooting.md
          - Frequently asked questions: en/question.md
      - Player guide:
          - Seasons and solar terms: en/season.md
          - Climate, weather, and snow: en/climate.md
          - Animals and fishing: en/animal.md
          - Configuration: en/configuration.md
          - Compatibility: en/compat.md
      - Datapack and modpack guide:
          - Start here: en/modpack_guide.md
          - Essential tags: en/data/tags.md
          - Common integrations:
              - Agricultural data: en/data/agriculture.md
              - Crop data-pack generator: en/datapack_generator.md
              - Simulation-level conditions: en/data/simulation_conditions.md
              - Climate and world rules: en/data/climate_and_world.md
      - Resource-pack guide:
          - Start here: en/resourcepack.md
          - Common visuals: en/custom/visuals.md
          - Optional audio: en/custom/audio.md
      - Developer API: en/developer_api.md
  - 中文:
      - 从这里开始:
          - 模组概览: zh/index.md
          - 快速开始: zh/quickly_start.md
          - 版本支持: zh/version_support.md
          - 故障排查: zh/troubleshooting.md
          - 常见问题: zh/question.md
      - 玩家指南:
          - 季节与节气: zh/season.md
          - 气候、天气与覆雪: zh/climate.md
          - 动物与钓鱼: zh/animal.md
          - 配置指南: zh/configuration.md
          - 兼容性: zh/compat.md
      - 数据包与整合包:
          - 从这里开始: zh/modpack_guide.md
          - 基础标签: zh/data/tags.md
          - 常用兼容:
              - 农业内容: zh/data/agriculture.md
              - 作物数据包生成器: zh/datapack_generator.md
              - 按模拟等级启用内容: zh/data/simulation_conditions.md
              - 气候与世界规则: zh/data/climate_and_world.md
      - 资源包制作:
          - 从这里开始: zh/resourcepack.md
          - 常用视觉: zh/custom/visuals.md
          - 可选声音: zh/custom/audio.md
      - 开发者 API: zh/developer_api.md

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - _static/css/custom.css
  - _static/css/datapack-generator.css
extra_javascript:
  - _static/js/custom.js
  - _static/js/jszip.min.js
  - _static/js/datapack-generator.js

docs_dir: source

extra:
  alternate:
    - name: English
      link: /en/latest/en/
      lang: en
    - name: 中文
      link: /en/latest/zh/
      lang: zh

plugins:
  - search
